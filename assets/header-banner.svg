<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="860" height="220" rx="16" fill="url(#bgGrad)"/>
  <rect width="860" height="220" rx="16" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="858.5" height="218.5" rx="15.25" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle radial highlights -->
  <circle cx="760" cy="45" r="110" fill="#38bdf8" fill-opacity="0.06"/>
  <circle cx="110" cy="185" r="95" fill="#fbbf24" fill-opacity="0.05"/>

  <!-- Top status pill -->
  <rect x="34" y="26" width="214" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/>
  <circle cx="50" cy="39" r="4.5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="43" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.06em">ONLINE // HANOI, VIETNAM</text>

  <!-- Main Name & Role -->
  <text x="34" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.02em">
    Toan Luong <tspan fill="#38bdf8">(ToanLB)</tspan>
  </text>
  <text x="34" y="128" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
    Unity Game Developer  &#x2022;  Automotive HMI Engineer  &#x2022;  Technical Writer
  </text>

  <!-- Bottom tagline -->
  <text x="34" y="176" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
    &gt; Building reliable real-time systems &#x2014; from 60 FPS mobile games to embedded AAOS/QNX clusters.
  </text>

  <!-- Right-side telemetry panel -->
  <rect x="576" y="26" width="250" height="122" rx="12" fill="#0b1120" fill-opacity="0.88" stroke="#334155" stroke-width="1"/>
  <text x="594" y="49" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.08em">SYSTEM PROFILE</text>
  <line x1="594" y1="58" x2="808" y2="58" stroke="#1e293b" stroke-width="1"/>

  <text x="594" y="79" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">ENGINES</text>
  <text x="668" y="79" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">Unity / Unreal</text>

  <text x="594" y="100" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">STACK</text>
  <text x="668" y="100" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">C# / C++ / TS</text>

  <text x="594" y="121" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">FOCUS</text>
  <text x="668" y="121" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">Arch &#x2022; GC &#x2022; GPU</text>

  <text x="594" y="139" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">BLOG</text>
  <text x="668" y="139" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">toanlb.dev</text>

  <!-- Accent bottom line -->
  <rect x="0" y="217" width="860" height="3" rx="1.5" fill="url(#accentLine)"/>
</svg>
