<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="ToanLB Real-Time Game Loop and Automotive HMI Architecture">
  <defs>
    <radialGradient id="cGlow" cx="0.5" cy="0.52" r="0.38">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A0F1E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="busL" x1="332" y1="0" x2="468" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="busR" x1="732" y1="0" x2="868" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="archDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="archFrame"><rect width="1200" height="560" rx="22"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flowL { stroke-dasharray: 16 14; animation: flowAnim 1.3s linear infinite; }
      .flowR { stroke-dasharray: 16 14; animation: flowAnim 1.3s linear infinite; }
      .spin { transform-box: fill-box; transform-origin: center; animation: spinCW 22s linear infinite; }
      .spinR { transform-box: fill-box; transform-origin: center; animation: spinCCW 40s linear infinite; }
      @keyframes flowAnim { to { stroke-dashoffset: -60; } }
      @keyframes spinCW { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
    </style>
  </defs>

  <g clip-path="url(#archFrame)">
    <rect width="1200" height="560" fill="#0A0F1E"/>
    <rect width="1200" height="560" fill="url(#archDots)"/>
    <rect width="1200" height="560" fill="url(#cGlow)"/>

    <!-- Header -->
    <text x="600" y="48" text-anchor="middle" class="m" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#38BDF8">REAL-TIME ENGINE &amp; CLUSTER ARCHITECTURE</text>
    <text x="600" y="82" text-anchor="middle" class="t" font-size="28" font-weight="800" fill="#F8FAFC">From Simulation Signals to Smooth Presentation</text>

    <!-- Animated Bus Paths (Left -> Center) -->
    <path d="M 332 186 C 405 186, 415 270, 468 286" stroke="#1E293B" stroke-width="3" fill="none"/>
    <path d="M 332 186 C 405 186, 415 270, 468 286" stroke="url(#busL)" stroke-width="2.5" fill="none" class="flowL"/>

    <path d="M 332 295 L 465 295" stroke="#1E293B" stroke-width="3" fill="none"/>
    <path d="M 332 295 L 465 295" stroke="url(#busL)" stroke-width="2.5" fill="none" class="flowL"/>

    <path d="M 332 404 C 405 404, 415 320, 468 304" stroke="#1E293B" stroke-width="3" fill="none"/>
    <path d="M 332 404 C 405 404, 415 320, 468 304" stroke="url(#busL)" stroke-width="2.5" fill="none" class="flowL"/>

    <!-- Animated Bus Paths (Center -> Right) -->
    <path d="M 732 286 C 785 270, 795 186, 868 186" stroke="#1E293B" stroke-width="3" fill="none"/>
    <path d="M 732 286 C 785 270, 795 186, 868 186" stroke="url(#busR)" stroke-width="2.5" fill="none" class="flowR"/>

    <path d="M 735 295 L 868 295" stroke="#1E293B" stroke-width="3" fill="none"/>
    <path d="M 735 295 L 868 295" stroke="url(#busR)" stroke-width="2.5" fill="none" class="flowR"/>

    <path d="M 732 304 C 785 320, 795 404, 868 404" stroke="#1E293B" stroke-width="3" fill="none"/>
    <path d="M 732 304 C 785 320, 795 404, 868 404" stroke="url(#busR)" stroke-width="2.5" fill="none" class="flowR"/>

    <!-- Left Pillar: Simulation & Signals -->
    <text x="52" y="122" class="m" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#2DD4BF">SIMULATION &amp; SIGNALS</text>

    <rect x="52" y="140" width="280" height="92" rx="14" fill="#111A30" stroke="#1F2B47" stroke-width="1.5"/>
    <circle cx="78" cy="170" r="5" fill="#2DD4BF"/>
    <text x="94" y="175" class="t" font-size="16" font-weight="700" fill="#F1F5F9">FixedUpdate &amp; Physics</text>
    <text x="74" y="200" class="t" font-size="13" fill="#94A3B8">Deterministic 50Hz stepping</text>
    <text x="74" y="218" class="m" font-size="11.5" fill="#2DD4BF">Anti Spiral-of-Death Clamping</text>

    <rect x="52" y="249" width="280" height="92" rx="14" fill="#111A30" stroke="#1F2B47" stroke-width="1.5"/>
    <circle cx="78" cy="279" r="5" fill="#38BDF8"/>
    <text x="94" y="284" class="t" font-size="16" font-weight="700" fill="#F1F5F9">CAN Bus &amp; Vehicle HAL</text>
    <text x="74" y="309" class="t" font-size="13" fill="#94A3B8">Real-time speed, RPM &amp; ADAS</text>
    <text x="74" y="327" class="m" font-size="11.5" fill="#38BDF8">Android Automotive &amp; QNX</text>

    <rect x="52" y="358" width="280" height="92" rx="14" fill="#111A30" stroke="#1F2B47" stroke-width="1.5"/>
    <circle cx="78" cy="388" r="5" fill="#A78BFA"/>
    <text x="94" y="393" class="t" font-size="16" font-weight="700" fill="#F1F5F9">Zero GC Memory Pool</text>
    <text x="74" y="418" class="t" font-size="13" fill="#94A3B8">Pre-warmed pools, value structs</text>
    <text x="74" y="436" class="m" font-size="11.5" fill="#A78BFA">0 B Hot-Path Allocations</text>

    <!-- Center Hub: Digital Cluster / Frame Budget Gauge -->
    <circle cx="600" cy="295" r="142" fill="#0B1222" stroke="#1E293B" stroke-width="2"/>
    <circle cx="600" cy="295" r="130" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5">
      <animate attributeName="r" values="125;152" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="295" r="126" fill="none" stroke="url(#ringArc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="220 580" class="spin"/>
    <circle cx="600" cy="295" r="112" fill="none" stroke="#64748B" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 10" class="spinR"/>

    <!-- Tachometer / Frame Budget Arc -->
    <path d="M 526 342 A 88 88 0 1 1 674 342" fill="none" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 526 342 A 88 88 0 0 1 648 220" fill="none" stroke="#2DD4BF" stroke-width="10" stroke-linecap="round"/>
    <path d="M 652 224 A 88 88 0 0 1 674 342" fill="none" stroke="#FBBF24" stroke-width="10" stroke-linecap="round"/>

    <!-- Sweeping Gauge Needle -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-110 600 295; 28 600 295; -18 600 295; 42 600 295; -110 600 295" dur="7.5s" repeatCount="indefinite"/>
      <polygon points="597,295 603,295 600,218" fill="#F43F5E"/>
      <circle cx="600" cy="295" r="8" fill="#F8FAFC"/>
    </g>

    <text x="600" y="346" text-anchor="middle" class="m" font-size="16" font-weight="800" fill="#F8FAFC">16.6 ms</text>
    <text x="600" y="366" text-anchor="middle" class="m" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#38BDF8">CORE LOOP • 60 FPS</text>
    <text x="600" y="384" text-anchor="middle" class="m" font-size="10.5" fill="#94A3B8">PURE C# DI &amp; MVP</text>

    <!-- Right Pillar: Presentation & Output -->
    <text x="868" y="122" class="m" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#FBBF24">PRESENTATION &amp; DELIVERY</text>

    <rect x="868" y="140" width="280" height="92" rx="14" fill="#111A30" stroke="#1F2B47" stroke-width="1.5"/>
    <circle cx="894" cy="170" r="5" fill="#FBBF24"/>
    <text x="910" y="175" class="t" font-size="16" font-weight="700" fill="#F1F5F9">SRP Batcher &amp; Shaders</text>
    <text x="890" y="200" class="t" font-size="13" fill="#94A3B8">Low SetPass calls, ASTC VRAM</text>
    <text x="890" y="218" class="m" font-size="11.5" fill="#FBBF24">Mobile &amp; Embedded GPU Budget</text>

    <rect x="868" y="249" width="280" height="92" rx="14" fill="#111A30" stroke="#1F2B47" stroke-width="1.5"/>
    <circle cx="894" cy="279" r="5" fill="#38BDF8"/>
    <text x="910" y="284" class="t" font-size="16" font-weight="700" fill="#F1F5F9">Cluster &amp; IVI Screens</text>
    <text x="890" y="309" class="t" font-size="13" fill="#94A3B8">Smooth frame pacing, zero judder</text>
    <text x="890" y="327" class="m" font-size="11.5" fill="#38BDF8">Unity &amp; Unreal Production</text>

    <rect x="868" y="358" width="280" height="92" rx="14" fill="#111A30" stroke="#1F2B47" stroke-width="1.5"/>
    <circle cx="894" cy="388" r="5" fill="#34D399"/>
    <text x="910" y="393" class="t" font-size="16" font-weight="700" fill="#F1F5F9">Roslyn &amp; NUnit Tested</text>
    <text x="890" y="418" class="t" font-size="13" fill="#94A3B8">Every blog snippet compiled</text>
    <text x="890" y="436" class="m" font-size="11.5" fill="#34D399">Published at toanlb.dev</text>

