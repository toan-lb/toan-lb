      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0A0F1E" stop-opacity="0"/>
