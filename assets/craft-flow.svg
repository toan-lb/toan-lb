    <linearGradient id="bus1" x1="332" y1="0" x2="468" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="bus2" x1="332" y1="0" x2="468" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="bus3" x1="332" y1="0" x2="468" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="busR1" x1="732" y1="0" x2="868" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="busR2" x1="732" y1="0" x2="868" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
