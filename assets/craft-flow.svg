      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="archFrame"><rect width="1200" height="560" rx="22"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow { stroke-dasharray: 14 14; animation: flowAnim 1.3s linear infinite; }
      .spin { transform-box: fill-box; transform-origin: center; animation: spinCW 20s linear infinite; }
      .spinR { transform-box: fill-box; transform-origin: center; animation: spinCCW 36s linear infinite; }
      @keyframes flowAnim { to { stroke-dashoffset: -56; } }
      @keyframes spinCW { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
    </style>
